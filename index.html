<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quét Serial KV2</title>
<meta name="description" content="Quét mã vạch serial bằng camera điện thoại, tự ghi vào Google Sheet và xuất Excel.">
<meta name="theme-color" content="#0e5fae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quét Serial">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1;
  --brand:#0e5fae; --brand2:#0b4f93; --brandSoft:#e8f1fb;
  --ok:#15803d; --okSoft:#e6f6ec; --warn:#b45309; --warnSoft:#fff4d6; --bad:#c02626; --badSoft:#fde8e8;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* App bar */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(14,95,174,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .logo{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:12px;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;max-width:52vw;padding:6px 11px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:none}
.pill.ok .dot{background:#4ade80}.pill.wait .dot{background:#fbbf24}.pill.bad .dot{background:#f87171}.pill.busy .dot{background:#93c5fd;animation:pulse 1s infinite}
.pill span{overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;flex:none}
@keyframes pulse{50%{opacity:.35}}

main{max-width:560px;margin:0 auto;padding:12px 12px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
main>*{min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}

/* Đợt quét – thông tin gắn kèm */
.session{overflow:hidden}
.field{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.field:first-child{border-top:0}
.field:active{background:#f8fafc}
.field .ic{width:34px;height:34px;border-radius:10px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;flex:none}
.field .txt{flex:1;min-width:0}
.field .lbl{display:block;font-size:12px;color:var(--muted);font-weight:500}
.field .val{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .val.missing{color:var(--bad);font-weight:500}
.field .val.opt{color:var(--muted);font-weight:500}
.field .chev{color:#94a3b8}

/* Camera */
.scanner{overflow:hidden}
.viewport{position:relative;aspect-ratio:4/3;max-height:48vh;width:100%;background:#0b1220;overflow:hidden;touch-action:manipulation}
.viewport video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b1220}
.guide{position:absolute;left:7%;right:7%;top:29%;height:42%;border-radius:12px;box-shadow:0 0 0 100vmax rgba(2,6,23,.42);outline:2px solid rgba(255,255,255,.92);transition:outline-color .15s,box-shadow .15s}
.guide .laser{position:absolute;left:5%;right:5%;top:50%;height:2px;background:#ff4040;box-shadow:0 0 10px 1px #ff4040;animation:laser 1.8s ease-in-out infinite}
@keyframes laser{0%,100%{transform:translateY(-30px);opacity:.55}50%{transform:translateY(30px);opacity:1}}
.guide.f-ok{outline:4px solid #22c55e}.guide.f-dup{outline:4px solid #ef4444}.guide.f-warn{outline:4px solid #f59e0b}
.hint{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-size:13px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 12px}
.cam-ctrl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:10px;padding:0 10px;z-index:2}
.cbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:999px;border:0;background:rgba(15,23,42,.62);color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cbtn.on{background:#facc15;color:#1f2937}
.cbtn.stop{background:rgba(220,38,38,.85)}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;color:#cbd5e1;background:radial-gradient(120% 90% at 50% 0%,#17325a 0%,#0b1220 70%)}
.idle p{margin:0;font-size:13px;max-width:320px}
.idle .err{color:#fecaca;background:rgba(220,38,38,.18);border:1px solid rgba(248,113,113,.5);padding:8px 10px;border-radius:10px}
.resume{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,6,23,.35);z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:600;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{height:54px;padding:0 24px;font-size:16.5px;border-radius:14px;box-shadow:0 6px 18px rgba(14,95,174,.45)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Kết quả quét gần nhất */
.last{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:68px}
.last .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:#f1f5f9;color:var(--muted)}
.last .t{min-width:0;flex:1}
.last .sn{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:.5px;word-break:break-all;line-height:1.2}
.last .msg{font-size:13px;color:var(--muted)}
.last.ok .badge{background:var(--okSoft);color:var(--ok)}.last.ok .msg{color:var(--ok)}
.last.dup .badge{background:var(--badSoft);color:var(--bad)}.last.dup .msg{color:var(--bad);font-weight:600}
.last.warn .badge{background:var(--warnSoft);color:var(--warn)}.last.warn .msg{color:var(--warn);font-weight:600}
.last.skip .msg{color:var(--muted)}
.manual{display:flex;gap:8px;padding:10px 12px}
.manual input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#f8fafc;font-family:var(--mono);font-weight:500;text-transform:uppercase}
.manual input::placeholder{font-family:'Be Vietnam Pro',system-ui,sans-serif;text-transform:none;font-weight:400;color:#94a3b8}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* Danh sách */
.list-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.list-head h2{margin:0;font-size:16px;flex:1;white-space:nowrap}
@media (max-width:380px){#btnHistory .t{display:none}#btnHistory{padding:0 8px}}
.list-head h2 .n{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 8px;margin-left:6px;border-radius:999px;background:var(--brand);color:#fff;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:#f1f5f9;color:var(--ink2);font-size:12.5px;font-weight:500}
.chip b{color:var(--ink)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.wait{background:#fef3c7;color:#92400e}
.search{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--muted)}
.search input{flex:1;height:40px;border:0;background:transparent;outline:0;min-width:0}
ol.recs{list-style:none;margin:0;padding:0 0 4px}
.rec{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.rec .no{width:30px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.rec .m{flex:1;min-width:0}
.rec .sn{font-family:var(--mono);font-weight:600;font-size:15.5px;letter-spacing:.3px;word-break:break-all}
.rec .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .note{font-size:12px;color:var(--warn);font-weight:500;margin-top:2px}
.rec .note.err{color:var(--bad)}
.rec .st{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex:none}
.rec .st svg{width:17px;height:17px}
.st.ok{color:var(--ok);background:var(--okSoft)}.st.wait{color:#b45309;background:#fef3c7}.st.busy{color:var(--brand);background:var(--brandSoft)}.st.bad{color:var(--bad);background:var(--badSoft)}.st.local{color:var(--muted);background:#f1f5f9}
.rec .del{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:#94a3b8;border-radius:10px;flex:none}
.rec .del:active{background:var(--badSoft);color:var(--bad)}
.rec.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{background:#dcfce7}100%{background:transparent}}
.empty{padding:22px 16px 26px;text-align:center;color:var(--muted);font-size:14px}
.more{padding:10px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

/* Thanh dưới */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bottombar .btn{flex:1;padding:0 10px}
.bottombar .btn.primary{flex:1.4}

/* Modal dạng bottom-sheet */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,6,23,.5);animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px;max-height:84vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:17px;flex:1}
.sh-head .x{width:38px;height:38px;border-radius:10px;border:0;background:#f1f5f9;display:grid;place-items:center}
.sh-body{overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}
.pick-sn{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#f1f5f9}
.pick-sn span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pick-sn b{font-family:var(--mono);font-size:19px;letter-spacing:.4px;word-break:break-all}
.pick-last{width:100%;justify-content:flex-start;margin-bottom:10px;box-shadow:none}
.pick-last .nm{overflow:hidden;text-overflow:ellipsis}
.pick-last small{margin-left:auto;padding-left:8px;font-weight:500;opacity:.85;font-size:12.5px}
.pick-recent{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip-btn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px}
.chip-btn:active{background:var(--brandSoft)}
.pick-search{position:sticky;top:-12px;z-index:1;background:#fff;padding:6px 0 4px;margin-top:-6px}
.last.pick .badge{background:var(--brandSoft);color:var(--brand)}.last.pick .msg{color:var(--brand);font-weight:600}
.pick-hint{margin:0 0 10px;font-size:13.5px;color:var(--ink2);background:var(--brandSoft);padding:9px 12px;border-radius:10px}
.opt-list{list-style:none;margin:8px 0 0;padding:0}
.opt-list li button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15.5px}
.opt-list li button:active{background:#f1f5f9}
.opt-list li button.sel{color:var(--brand);font-weight:700}
.opt-list .tag{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
.opt-list .add{color:var(--brand);font-weight:600}
.inp{width:100%;height:46px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#f8fafc}
.sec{margin:4px 0 16px}
.sec h4{margin:0 0 8px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{display:block;font-size:12.5px;color:var(--muted)}
.row input[type=text],.row input[type=number],.row select{height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:#f8fafc;width:120px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:#cbd5e1;transition:.15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.status-box{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:13.5px;background:#f1f5f9;color:var(--ink2);word-break:break-word}
.status-box.ok{background:var(--okSoft);color:var(--ok)}.status-box.bad{background:var(--badSoft);color:var(--bad)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.hist{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.hist .h1{font-weight:600}
.hist .h2{font-size:13px;color:var(--muted);margin-top:2px}
.hist .btn-row{margin-top:8px}
a{color:var(--brand)}

/* Toast */
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;max-width:520px;text-align:center;padding:11px 16px;border-radius:12px;background:#0f172a;color:#fff;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
.toast.ok{background:#14532d}.toast.warn{background:#92400e}.toast.bad{background:#991b1b}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
/* =====================================================================
   QUÉT SERIAL KV2
   ---------------------------------------------------------------------
   ⚙️  DÁN URL Apps Script (Ứng dụng web, đuôi /exec) vào SCRIPT_URL để
       cả team dùng chung – không phải cài đặt trên từng điện thoại.
       Để trống thì mỗi máy tự dán URL trong Cài đặt (hoặc mở link cài đặt
       dạng  .../scan/#api=<URL>  mà app tạo ra).
   ===================================================================== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwaumb04tZoVcZE6V--lb37675aqM1EGSszBm2f_tH_Ulq_bErLdtuDfzr77S0x3MimPA/exec';
const APP_VERSION = '1.1.0';
(() => {
'use strict';

/* ------------------------------------------------------------------
   Tiện ích chung
------------------------------------------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtDT = (ms) => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fold = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const icon = (id, cls = '') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

const KEY = { settings: 'qs.settings', session: 'qs.session', batches: 'qs.batches', dels: 'qs.dels', config: 'qs.config', recent: 'qs.recent', device: 'qs.device', custom: 'qs.custom' };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
let storageWarned = false;
const store = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { if (!storageWarned) { storageWarned = true; toast('Bộ nhớ trình duyệt đầy – hãy xuất Excel và xoá bớt đợt cũ trong Lịch sử', 'bad', 5000); } }
};

/* ------------------------------------------------------------------
   Trạng thái
------------------------------------------------------------------ */
const DEF = { api: '', sound: true, vibrate: true, continuous: true, retail: false, prefix: '', minLen: 6, engine: 'auto', cameraId: '' };
const newBatch = () => ({ id: uid(), at: Date.now(), records: [] });
const S = {
  settings: Object.assign({}, DEF, load(KEY.settings, {})),
  session: Object.assign({ user: '', location: '', model: '' }, load(KEY.session, {})),
  batches: load(KEY.batches, null),
  dels: load(KEY.dels, []),
  config: Object.assign({ models: [], locations: [], users: [], sheetUrl: '', sheetName: '', at: 0 }, load(KEY.config, {})),
  recent: Object.assign({ models: [], locations: [], users: [] }, load(KEY.recent, {})),
  device: load(KEY.device, ''),
};
if (!Array.isArray(S.batches) || !S.batches.length) S.batches = [newBatch()];
S.custom = Object.assign({ models: [] }, load(KEY.custom, {}));
if (!S.device) {
  const ua = navigator.userAgent;
  const kind = /iPhone|iPad|iPod/i.test(ua) ? 'iPhone' : /Android/i.test(ua) ? 'Android' : 'PC';
  S.device = `${kind}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
  store(KEY.device, S.device);
}
// Bản ghi đang gửi dở khi tắt app → đưa về chờ gửi
S.batches.forEach((b) => b.records.forEach((r) => { if (r.st === 'sending') r.st = 'pending'; }));

const saveSettings = () => store(KEY.settings, S.settings);
const saveSession = () => store(KEY.session, S.session);
const saveBatches = () => store(KEY.batches, S.batches);
const saveDels = () => store(KEY.dels, S.dels);
const cur = () => S.batches[S.batches.length - 1];
const allRecs = () => S.batches.flatMap((b) => b.records);
const apiUrl = () => (S.settings.api || SCRIPT_URL || '').trim();

// Link cài đặt cho team: .../#api=<URL>
(function readHash() {
  const m = location.hash.match(/(?:^#|&)api=([^&]+)/);
  if (!m) return;
  try {
    const u = decodeURIComponent(m[1]);
    if (/^https:\/\//.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(u)) { S.settings.api = u; saveSettings(); setTimeout(() => toast('Đã kết nối Google Sheet từ link cài đặt', 'ok'), 400); }
  } catch (e) { /* bỏ qua */ }
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ------------------------------------------------------------------
   Phản hồi: âm thanh, rung, toast
------------------------------------------------------------------ */
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(f, t, d, v = 0.16, type = 'square') {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.03);
}
function beep(kind) {
  if (!S.settings.sound || !actx) return;
  try {
    const t = actx.currentTime + 0.01;
    if (kind === 'ok') tone(1760, t, 0.09);
    else if (kind === 'warn') { tone(988, t, 0.1, 0.14); tone(988, t + 0.17, 0.1, 0.14); }
    else { tone(330, t, 0.16, 0.2, 'sawtooth'); tone(247, t + 0.2, 0.24, 0.2, 'sawtooth'); }
  } catch (e) { /* bỏ qua */ }
}
function buzz(kind) {
  if (!S.settings.vibrate || !navigator.vibrate) return;
  try { navigator.vibrate(kind === 'ok' ? 70 : kind === 'warn' ? [70, 60, 70] : [150, 80, 150]); } catch (e) { /* bỏ qua */ }
}
function feedback(kind) {
  beep(kind); buzz(kind);
  const g = $('#guide');
  g.classList.remove('f-ok', 'f-dup', 'f-warn');
  void g.offsetWidth;
  g.classList.add(kind === 'ok' ? 'f-ok' : kind === 'warn' ? 'f-warn' : 'f-dup');
  clearTimeout(feedback.t); feedback.t = setTimeout(() => g.classList.remove('f-ok', 'f-dup', 'f-warn'), 650);
}
let toastEl = null, toastT = 0;
function toast(msg, kind = '', ms = 2600) {
  if (toastEl) toastEl.remove();
  toastEl = document.createElement('div');
  toastEl.className = 'toast ' + kind; toastEl.setAttribute('role', 'status');
  toastEl.textContent = msg; document.body.appendChild(toastEl);
  clearTimeout(toastT); toastT = setTimeout(() => { if (toastEl) { toastEl.remove(); toastEl = null; } }, ms);
}

/* ------------------------------------------------------------------
   Modal (bottom sheet)
------------------------------------------------------------------ */
let modalStack = [];
const modalOpen = () => modalStack.length > 0;
function openModal({ title, body, foot, onClose }) {
  const root = document.createElement('div');
  root.className = 'modal';
  root.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sh-head"><h3>${esc(title)}</h3><button class="x" type="button" aria-label="Đóng">${icon('x')}</button></div>
    <div class="sh-body"></div>${foot ? '<div class="sh-foot"></div>' : ''}</div>`;
  const m = { root, body: $('.sh-body', root), foot: $('.sh-foot', root), onClose };
  if (typeof body === 'string') m.body.innerHTML = body; else if (body) m.body.appendChild(body);
  if (foot) { if (typeof foot === 'string') m.foot.innerHTML = foot; else m.foot.appendChild(foot); }
  m.close = () => closeModal(m);
  $('.x', root).onclick = m.close;
  root.addEventListener('mousedown', (e) => { if (e.target === root) m.close(); });
  document.body.appendChild(root);
  modalStack.push(m);
  return m;
}
function closeModal(m) {
  const i = modalStack.indexOf(m);
  if (i < 0) return;
  modalStack.splice(i, 1);
  m.root.remove();
  if (m.onClose) m.onClose();
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen()) closeModal(modalStack[modalStack.length - 1]); });

function confirmBox(title, html, okText = 'Đồng ý', danger = false) {
  return new Promise((resolve) => {
    let done = false;
    const foot = document.createElement('div');
    foot.style.display = 'contents';
    foot.innerHTML = `<button class="btn" type="button" data-a="no">Huỷ</button><button class="btn ${danger ? 'danger' : 'primary'}" type="button" data-a="yes">${esc(okText)}</button>`;
    const m = openModal({ title, body: `<div style="font-size:15px">${html}</div>`, foot, onClose: () => { if (!done) resolve(false); } });
    foot.querySelector('[data-a=no]').onclick = () => m.close();
    foot.querySelector('[data-a=yes]').onclick = () => { done = true; m.close(); resolve(true); };
  });
}

/* ------------------------------------------------------------------
   Người quét / Kho-NPP-Đại lý
------------------------------------------------------------------ */
const FIELDS = {
  user: { title: 'Người quét', list: 'users', ph: 'Gõ tên người quét…', empty: 'Chưa chọn – bấm để chọn' },
  location: { title: 'Kho / NPP / Đại lý', list: 'locations', ph: 'Tìm hoặc gõ tên kho / NPP / đại lý…', empty: 'Chưa chọn – bấm để chọn' },
};
function renderSession() {
  for (const k of Object.keys(FIELDS)) {
    const v = S.session[k], el = $('#v-' + k);
    el.textContent = v || FIELDS[k].empty;
    el.className = 'val' + (v ? '' : ' missing');
  }
}
function pushRecent(listName, v) {
  if (!v) return;
  const a = S.recent[listName].filter((x) => x.toUpperCase() !== v.toUpperCase());
  a.unshift(v); S.recent[listName] = a.slice(0, 8); store(KEY.recent, S.recent);
}
function openPicker(field, then, hintText) {
  const f = FIELDS[field];
  const wrap = document.createElement('div');
  wrap.innerHTML = `${hintText ? `<p class="pick-hint">${esc(hintText)}</p>` : ''}<input class="inp" type="search" placeholder="${esc(f.ph)}" autocomplete="off" autocapitalize="words">
    <ul class="opt-list"></ul><p class="muted" data-hint></p>`;
  const inp = $('input', wrap), ul = $('ul', wrap), hint = $('[data-hint]', wrap);
  const m = openModal({ title: f.title, body: wrap });
  const choose = (v) => {
    S.session[field] = v; saveSession(); pushRecent(f.list, v); renderSession(); m.close();
    if (then) then();
  };
  const draw = () => {
    const q = inp.value.trim(), fq = fold(q);
    const recent = S.recent[f.list] || [], base = S.config[f.list] || [];
    const seen = new Set(), items = [];
    const add = (v, tag) => { const k = v.toUpperCase(); if (seen.has(k)) return; seen.add(k); items.push({ v, tag }); };
    recent.forEach((v) => add(v, 'gần đây'));
    base.forEach((v) => add(v, ''));
    const hits = fq ? items.filter((x) => fold(x.v).includes(fq)) : items;
    const exact = q && items.some((x) => x.v.toUpperCase() === q.toUpperCase());
    let html = '';
    hits.slice(0, 80).forEach((x) => {
      html += `<li><button type="button" data-v="${esc(x.v)}" class="${x.v === S.session[field] ? 'sel' : ''}">${esc(x.v)}${x.tag ? `<span class="tag">${x.tag}</span>` : ''}</button></li>`;
    });
    if (q && !exact) html += `<li><button type="button" class="add" data-v="${esc(q)}">${icon('plus')}Dùng tên mới “${esc(q)}”</button></li>`;
    ul.innerHTML = html;
    hint.textContent = hits.length > 80 ? `Còn ${hits.length - 80} mục nữa – gõ thêm để lọc.`
      : !items.length ? (apiUrl() ? 'Danh sách trống. Gõ tên rồi bấm “Dùng tên mới…”, hoặc điền tab “Danh mục” trong Google Sheet.' : 'Gõ tên rồi bấm “Dùng tên mới…”.') : '';
  };
  ul.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) choose(b.dataset.v); });
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const q = inp.value.trim(); if (!q) return;
    const opts = [...ul.querySelectorAll('button[data-v]:not(.add)')].filter((b) => b.dataset.v);
    const exact = opts.find((b) => b.dataset.v.toUpperCase() === q.toUpperCase());
    choose(exact ? exact.dataset.v : opts.length === 1 ? opts[0].dataset.v : q);
  });
  draw();
  const total = (S.config[f.list] || []).length + (S.recent[f.list] || []).length;
  if (!matchMedia('(pointer:coarse)').matches || total === 0 || total > 12) setTimeout(() => inp.focus(), 60);
  if (apiUrl() && Date.now() - (S.config.at || 0) > 30 * 60 * 1000) loadConfig(true).then(() => { if (modalStack.includes(m)) draw(); });
}
/** Bắt buộc có Người quét + Kho/NPP/Đại lý trước khi quét */
function ensureSession(then) {
  const next = () => { if (ensureSession(then) && then) then(); };
  if (!S.session.user) { openPicker('user', next, 'Chọn tên người quét (chỉ hỏi lần đầu).'); return false; }
  if (!S.session.location) { openPicker('location', next, 'Đang quét ở kho / NPP / đại lý nào?'); return false; }
  return true;
}

/* ------------------------------------------------------------------
   Danh sách sản phẩm – quét xong Sale chọn sản phẩm cho từng serial.
   Thêm mã cho cả team: điền vào cột A tab "Danh mục" trên Google Sheet.
   Sale gõ mã chưa có → "Thêm mã mới" (nhớ trên máy đó).
------------------------------------------------------------------ */
const PRODUCTS = [
  "KAE-S88 Promax", "KAE-S86 Pro", "KAE-S86", "KAE-S68 Pro", "KAE-S68", "KAE-S18",
  "KAE-S16", "KAD-N91", "KAD-N89", "KAD-N69", "KAD-D69", "KAD-D66S Pro",
  "KAD-D66S", "KAD-L85", "KAD-L82", "KAD-M68", "KAD-E58", "KAH-D10",
  "KAH-D15", "KAH-D18", "KAQ-L22", "KAQ-E16", "KAQ-D36S", "KAQ-L06",
  "KAQ-D20", "KAQ-D36", "KHY-TN88", "KAQ-U99", "KAQ-U98", "KAQ-U65",
  "KAQ-U96 Pro", "KAQ-U05 Pro", "KAQ-U03 Pro", "KAQ-U50K", "KAO-T90", "HCV208RO",
  "HCV208B", "HCV208G", "HCV208", "HCV209", "HC18", "HC19",
  "HC16", "HC15", "KT-KB30 +BA", "KT-KB50 +BA", "KT-KB80", "Quạt Livotec S-100",
  "Quạt Livotec S-200", "Lõi Hydrogen Ion Kiềm", "Bộ lõi Smax Pro V", "WPK-938", "WPK-928", "WPK-903",

const normKey = (x) => fold(x).replace(/[^a-z0-9]/g, '');
function productList() {

  const add = (v, tag) => { v = String(v || '').trim(); const k = v.toUpperCase(); if (!v || seen.has(k)) return; seen.add(k); out.push({ v, tag }); };
  PRODUCTS.forEach((v) => add(v, ''));

/** Mở bảng chọn sản phẩm cho 1 serial. Trả về tên sản phẩm, hoặc null nếu bỏ qua. */
function pickProduct(serial) {
  return new Promise((resolve) => {
    let done = false;
    const last = S.recent.models[0] || '';
    const recents = S.recent.models.slice(1, 7);
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="pick-sn"><span>Serial</span><b>${esc(serial)}</b></div>
      ${last ? `<button type="button" class="btn primary big pick-last" data-v="${esc(last)}">${icon('check')}<span class="nm">${esc(last)}</span><small>như lần trước</small></button>` : ''}
      ${recents.length ? `<div class="pick-recent">${recents.map((v) => `<button type="button" class="chip-btn" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>` : ''}
      <div class="pick-search"><input class="inp" type="search" placeholder="Tìm: gõ vài ký tự, VD u95, 630, quạt…" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
      <ul class="opt-list"></ul><p class="muted" data-hint></p>`;
    const foot = document.createElement('div');
    foot.style.display = 'contents';
    foot.innerHTML = `<button class="btn" type="button" data-a="skip">${icon('x')}Bỏ qua serial này</button>`;
    const m = openModal({ title: 'Chọn sản phẩm', body: wrap, foot, onClose: () => { if (!done) { done = true; resolve(null); } } });
    const finish = (v) => { if (done) return; done = true; m.close(); resolve(v); };
    const inp = $('input', wrap), ul = $('ul', wrap), hint = $('[data-hint]', wrap);
    const choose = (v) => {
      v = String(v || '').replace(/\s+/g, ' ').trim();
      if (!v) return;
      if (!productList().some((x) => x.v.toUpperCase() === v.toUpperCase())) {
        S.custom.models = [v].concat(S.custom.models.filter((x) => x.toUpperCase() !== v.toUpperCase())).slice(0, 200);
        store(KEY.custom, S.custom);
      }
      pushRecent('models', v);
      finish(v);
    };
    const draw = () => {
      const q = inp.value.trim();
      const toks = q.split(/\s+/).map(normKey).filter(Boolean);
      const all = productList();
      const hits = toks.length ? all.filter((x) => { const k = normKey(x.v); return toks.every((t) => k.includes(t)); }) : all;
      const exact = q && all.some((x) => x.v.toUpperCase() === q.toUpperCase());
      let html = hits.slice(0, 150).map((x) => `<li><button type="button" data-v="${esc(x.v)}">${esc(x.v)}${x.tag ? `<span class="tag">${x.tag}</span>` : ''}</button></li>`).join('');
      if (q && !exact) html += `<li><button type="button" class="add" data-v="${esc(q)}">${icon('plus')}Thêm mã mới “${esc(q)}”</button></li>`;
      ul.innerHTML = html;
      hint.textContent = q && !hits.length ? 'Không có trong danh sách – bấm “Thêm mã mới” để dùng mã này.' : '';
    };
    wrap.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) choose(b.dataset.v); });
    foot.querySelector('[data-a=skip]').onclick = () => finish(null);
    inp.addEventListener('input', draw);
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const q = inp.value.trim();
      if (!q) { if (last) choose(last); return; }
      const opts = [...ul.querySelectorAll('button[data-v]:not(.add)')];
      const exact = opts.find((b) => b.dataset.v.toUpperCase() === q.toUpperCase());
      choose(exact ? exact.dataset.v : opts.length === 1 ? opts[0].dataset.v : q);
    });
    draw();
    if (!matchMedia('(pointer:coarse)').matches) setTimeout(() => inp.focus(), 60);
    if (apiUrl() && Date.now() - (S.config.at || 0) > 30 * 60 * 1000) loadConfig(true).then(() => { if (!done) draw(); });
  });
}

function cleanCode(s) { return String(s || '').replace(/[\u0000-\u001F\u007F]/g, '').trim(); }

/** src: 'cam' | 'hid' | 'manual'. Đọc được mã → chọn sản phẩm → lưu. Trả về true nếu đã lưu. */
let picking = false;
async function addSerial(raw, fmt, src) {
  let serial = cleanCode(raw);
  if (src === 'manual') serial = serial.replace(/\s+/g, '').toUpperCase();
  if (!serial || picking) return false;
  if (src !== 'manual') {
    if (serial.length < (+S.settings.minLen || 0)) { showLast('skip', serial, `Bỏ qua: mã quá ngắn (< ${S.settings.minLen} ký tự)`); return false; }
    const pf = (S.settings.prefix || '').trim().toUpperCase();
    if (pf && !serial.toUpperCase().startsWith(pf)) { showLast('skip', serial, `Bỏ qua: không bắt đầu bằng “${pf}”`); return false; }
  }
  if (!S.session.user || !S.session.location) { ensureSession(); return false; }
  const findDup = () => cur().records.findIndex((r) => r.serial.toUpperCase() === serial.toUpperCase());
  const dupMsg = (idx) => {
    const r = cur().records[idx];
    feedback('dup');
    showLast('dup', serial, `TRÙNG – đã quét lúc ${fmtTime(r.at)} (dòng #${idx + 1} · ${r.model || 'chưa có SP'})`);
    flashRow(r.id);
  };
  let idx = findDup();
  if (idx >= 0) { dupMsg(idx); return false; }
  const at = Date.now();
  feedback('ok');
  showLast('pick', serial, 'Đã đọc mã – chọn sản phẩm để lưu');
  picking = true;
  let model = null;
  try { model = await pickProduct(serial); } finally { picking = false; }
  cam.lastSeen = Date.now(); cam.cooldownUntil = Date.now() + 700; // thùng vừa quét còn trong khung → không báo trùng
  if (!model) { showLast('skip', serial, 'Chưa lưu – đã bỏ qua serial này'); return false; }
  idx = findDup();
  if (idx >= 0) { dupMsg(idx); return false; }
  const b = cur();
  const rec = { id: uid(), serial, model, location: S.session.location, user: S.session.user, at, fmt: fmt || '', src, st: 'pending', tries: 0, note: '' };
  b.records.push(rec);
  saveBatches();
  showLast('ok', serial, `Đã lưu #${b.records.length} · ${model}`);
  renderList(rec.id);
  renderStatus();
  sync();
  return true;
}
async function deleteRecord(id) {

  const r = b.records[i];
  const ok = await confirmBox('Xoá serial?', `<div style="font-family:var(--mono);font-weight:600;font-size:18px;margin-bottom:6px">${esc(r.serial)}</div>` +
    (r.st === 'ok' ? 'Dòng này cũng sẽ được xoá khỏi Google Sheet (chuyển sang tab “Đã xoá”).' : 'Serial chưa lên Google Sheet, chỉ xoá trên máy.'), 'Xoá', true);

/* ------------------------------------------------------------------
   Đồng bộ Google Sheet (Apps Script)
------------------------------------------------------------------ */
let syncBusy = false, syncAgain = false, syncTimer = 0, backoff = 0, lastErr = '';
async function api(payload, timeoutMs = 30000) {
  const url = apiUrl();
  if (!url) throw new Error('Chưa cài URL Google Sheet');
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  let res;
  try {
    // text/plain → "simple request", không bị chặn CORS với Apps Script
    res = await fetch(url, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal, redirect: 'follow', cache: 'no-store' });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Hết thời gian chờ Google Sheet phản hồi');
    throw new Error('Không gửi được – kiểm tra mạng, URL, hoặc quyền “Bất kỳ ai” khi triển khai');
  } finally { clearTimeout(t); }
  if (!res.ok) throw new Error('Google Sheet báo lỗi HTTP ' + res.status);
  const txt = await res.text();
  let data;
  try { data = JSON.parse(txt); } catch (e) { throw new Error(/<html/i.test(txt) ? 'Script trả về trang đăng nhập – triển khai lại với quyền “Bất kỳ ai”' : 'Phản hồi không hợp lệ từ Google Sheet'); }
  if (!data.ok) throw new Error(data.error || 'Google Sheet báo lỗi');
  return data;
}
function payloadOf(r) {
  return { id: r.id, serial: r.serial, model: r.model, location: r.location, user: r.user, scannedAt: r.at, device: S.device };
}
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync() {
  clearTimeout(syncTimer);
  if (!apiUrl()) { renderStatus(); return; }
  if (syncBusy) { syncAgain = true; return; }
  if (navigator.onLine === false) { renderStatus(); return; }
  syncBusy = true; syncAgain = false; renderStatus();
  const repeats = [];
  try {
    if (S.dels.length) {
      const ids = S.dels.slice(0, 100);
      const res = await api({ action: 'delete', ids, by: S.session.user });
      const done = new Set([].concat(res.deleted || [], res.notFound || []));
      S.dels = S.dels.filter((id) => !done.has(id)); saveDels();
    }
    const batch = allRecs().filter((r) => r.st === 'pending' || r.st === 'err').slice(0, 25);
    if (batch.length) {
      batch.forEach((r) => { r.st = 'sending'; r.tries = (r.tries || 0) + 1; });
      renderList();
      let res;
      try { res = await api({ action: 'add', items: batch.map(payloadOf) }); }
      catch (e) { batch.forEach((r) => { if (r.st === 'sending') { r.st = 'err'; r.err = ''; } }); throw e; }
      const byId = new Map(batch.map((r) => [r.id, r]));
      (res.results || []).forEach((x) => {
        const r = byId.get(x.id); if (!r) return;
        if (x.status === 'ok') {
          r.st = 'ok'; r.row = x.row; r.note = x.note || ''; r.err = '';
          if (r.note && !r.warned) { r.warned = true; repeats.push(r); }
        } else { r.st = 'bad'; r.err = x.error || 'Sheet từ chối bản ghi này'; }
      });
      batch.forEach((r) => { if (r.st === 'sending') r.st = 'pending'; });
      // Bản ghi bị xoá trên máy trong lúc đang gửi → xoá luôn trên Sheet
      const live = new Set(allRecs().map((r) => r.id));
      batch.forEach((r) => { if (!live.has(r.id) && r.st === 'ok' && !S.dels.includes(r.id)) S.dels.push(r.id); });
      saveDels();
    }
    backoff = 0; lastErr = '';
    saveBatches();
    if (repeats.length) {
      const r = repeats[repeats.length - 1];
      feedback('warn');
      const inBanner = repeats.length === 1 && lastEvt && lastEvt.serial === r.serial;
      if (lastEvt && lastEvt.serial === r.serial) showLast('warn', r.serial, 'Đã có trên Sheet: ' + r.note);
      if (!inBanner) toast(repeats.length === 1 ? `${r.serial} đã từng quét: ${r.note}` : `${repeats.length} serial đã từng có trên Sheet (dòng có dấu ⚠)`, 'warn', 5000);
    }
    if (allRecs().some((r) => r.st === 'pending' || r.st === 'err') || S.dels.length) syncAgain = true;
  } catch (e) {
    lastErr = e.message || String(e);
    backoff = Math.min(backoff ? backoff * 2 : 4000, 120000);
    scheduleSync(backoff);
  } finally {
    syncBusy = false;
    renderList(); renderStatus();
    if (syncAgain && !lastErr) { syncAgain = false; scheduleSync(250); }
  }
}
function renderStatus() {
  const pill = $('#pill'), txt = $('#pillTxt');
  const waiting = allRecs().filter((r) => r.st !== 'ok').length + S.dels.length;
  let cls = '', t = '';
  if (!apiUrl()) { cls = ''; t = 'Chưa nối Sheet'; }
  else if (navigator.onLine === false) { cls = 'wait'; t = waiting ? `Mất mạng · chờ ${waiting}` : 'Mất mạng'; }
  else if (syncBusy) { cls = 'busy'; t = 'Đang gửi…'; }
  else if (lastErr && waiting) { cls = 'bad'; t = `Lỗi gửi · chờ ${waiting}`; }
  else if (waiting) { cls = 'wait'; t = `Chờ gửi ${waiting}`; }
  else { cls = 'ok'; t = allRecs().length ? 'Đã lên Sheet' : 'Đã nối Sheet'; }
  pill.className = 'pill ' + cls; txt.textContent = t;
  pill.title = lastErr || t;
}
$('#pill').addEventListener('click', () => {

  if (lastErr) toast(lastErr, 'bad', 4500);
  backoff = 0; sync();
});
async function loadConfig(silent) {
  const url = apiUrl();
  if (!url) return false;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 20000);
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=config', { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(t);
    const data = JSON.parse(await res.text());
    if (!data.ok) throw new Error(data.error || 'lỗi');
    S.config = { models: data.models || [], locations: data.locations || [], users: data.users || [], sheetUrl: data.sheetUrl || '', sheetName: data.sheetName || '', at: Date.now() };
    store(KEY.config, S.config);
    if (!silent) toast(`Đã tải danh mục: ${S.config.models.length} model, ${S.config.locations.length} kho/NPP/đại lý, ${S.config.users.length} người`, 'ok', 3500);

}

  const defNames = sheets.map((sh, i) => sh.filter && sh.rows.length ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${sh.name.replace(/'/g, "''")}'!$A$1:$${colL(sh.header.length - 1)}$${sh.rows.length + 1}</definedName>` : '').join('');
  files.unshift(
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>` },
    { name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Danh sách serial</dc:title><dc:creator>Quét Serial KV2</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>` },
    { name: 'docProps/app.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Quét Serial KV2</Application></Properties>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook ${ns}><bookViews><workbookView activeTab="0"/></bookViews><sheets>${sheets.map((sh, i) => `<sheet name="${xEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${defNames ? `<definedNames>${defNames}</definedNames>` : ''}</workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId${sheets.length + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: STYLES },
  );
  files.push({ name: 'xl/sharedStrings.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sst.length}" uniqueCount="${sst.length}">${sst.map((s) => `<si><t xml:space="preserve">${xEsc(s)}</t></si>`).join('')}</sst>` });
  return zipStore(files);
}
function statusText(r) {
  if (r.st === 'ok') return r.note ? 'Đã lên Sheet · ' + r.note : 'Đã lên Sheet';
  if (!apiUrl()) return 'Chỉ lưu trên máy';
  if (r.st === 'bad') return 'Lỗi: ' + (r.err || 'Sheet từ chối');
  return 'Chưa đồng bộ';
}
const slug = (s) => fold(s).replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'KV2';
function batchFile(batch) {
  const recs = batch.records.slice().sort((a, b) => a.at - b.at);
  const rows = recs.map((r, i) => [i + 1, { v: r.serial, s: 5 }, r.model, r.location, r.user, new Date(r.at), r.note ? { v: statusText(r), s: 7 } : statusText(r)]);
  const grp = new Map();
  recs.forEach((r) => { const k = (r.location || '') + '\u0001' + (r.model || '(chưa chọn)'); grp.set(k, (grp.get(k) || 0) + 1); });
  const sum = [...grp.entries()].sort((a, b) => a[0].localeCompare(b[0], 'vi')).map(([k, n]) => { const [l, m] = k.split('\u0001'); return [l, m, n]; });
  sum.push([{ v: 'Tổng cộng', s: 5 }, { v: '', s: 5 }, { v: recs.length, s: 6 }]);
  const blob = buildXlsx([
    { name: 'Serial', header: ['STT', 'Serial', 'Sản phẩm', 'Kho / NPP / Đại lý', 'Người quét', 'Thời gian quét', 'Google Sheet'], rows, cols: [6, 20, 24, 30, 20, 20, 48], filter: true },
    { name: 'Tổng hợp', header: ['Kho / NPP / Đại lý', 'Sản phẩm', 'Số lượng'], rows: sum, cols: [34, 26, 12], filter: false },
  ]);
  const locs = [...new Set(recs.map((r) => r.location).filter(Boolean))];
  const d = new Date(recs.length ? recs[recs.length - 1].at : Date.now());
  const name = `Serial_${slug(locs.length === 1 ? locs[0] : 'KV2')}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.xlsx`;
  return { blob, name, n: recs.length };
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.xlsx', { type: XLSX_MIME })] })); } catch (e) { return false; }
}
async function exportBatch(batch, mode) {
  if (!batch.records.length) { toast('Đợt này chưa có serial nào'); return; }
  const { blob, name, n } = batchFile(batch);
  if (mode === 'share') {
    try { await navigator.share({ files: [new File([blob], name, { type: XLSX_MIME })], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; toast('Không mở được chia sẻ – đang tải file về máy'); }
  }
  downloadBlob(blob, name);
  toast(`Đã xuất ${n} serial → ${name}`, 'ok', 3500);
}
$('#btnExcel').onclick = () => exportBatch(cur(), 'download');
$('#btnShare').onclick = () => exportBatch(cur(), 'share');
$('#btnShare').hidden = !canShareFiles();
$('#btnCopy').onclick = async () => {
  const recs = cur().records;
  if (!recs.length) { toast('Đợt này chưa có serial nào'); return; }
  const text = recs.map((r) => r.serial).join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) { /* */ } ta.remove();
  }
  toast(`Đã sao chép ${recs.length} serial – dán vào Zalo/Excel`, 'ok');
};

/* ------------------------------------------------------------------
   Đợt mới & Lịch sử
------------------------------------------------------------------ */
$('#btnNewBatch').onclick = async () => {
  const b = cur();
  if (!b.records.length) { toast('Đợt hiện tại đang trống'); return; }
  const wait = apiUrl() ? b.records.filter((r) => r.st !== 'ok').length : 0;
  const ok = await confirmBox('Bắt đầu đợt mới?', `Danh sách hiện tại (<b>${b.records.length}</b> serial) được chuyển vào <b>Lịch sử</b> – vẫn xuất Excel lại được.` +
    (wait ? `<br><br>${wait} serial chưa lên Sheet sẽ tiếp tục được gửi khi có mạng.` : ''), 'Đợt mới');
  if (!ok) return;
  S.batches.push(newBatch());
  pruneBatches();
  saveBatches(); renderList(); renderStatus();
  showLast('skip', '', 'Đợt mới – sẵn sàng quét');
  // Đợt mới thường là điểm khác → cho chọn lại Kho/NPP/Đại lý (đóng lại = giữ nguyên)
  openPicker('location', null, 'Đợt mới đang quét ở kho / NPP / đại lý nào? Đóng lại nếu vẫn là: ' + (S.session.location || '—'));
};
function pruneBatches() {
  const MAX_BATCHES = 40, MAX_RECS = 10000;
  while (S.batches.length > 1 && (S.batches.length > MAX_BATCHES || allRecs().length > MAX_RECS)) {
    // Có Google Sheet: chỉ bỏ đợt cũ đã gửi xong. Chỉ lưu trên máy: bỏ đợt cũ nhất.
    const i = S.batches.findIndex((b, k) => k < S.batches.length - 1 && (!apiUrl() || b.records.every((r) => r.st === 'ok')));
    if (i < 0) break;
    S.batches.splice(i, 1);
  }
}
function openHistory() {
  const wrap = document.createElement('div');
  const draw = () => {
    const past = S.batches.slice(0, -1).reverse();
    if (!past.length) { wrap.innerHTML = '<p class="muted">Chưa có đợt cũ. Khi bấm “Đợt mới”, danh sách hiện tại sẽ được lưu ở đây.</p>'; return; }
    wrap.innerHTML = past.map((b) => {
      const recs = b.records, n = recs.length;
      const locs = [...new Set(recs.map((r) => r.location).filter(Boolean))];
      const wait = apiUrl() ? recs.filter((r) => r.st !== 'ok').length : 0;
      const t0 = n ? Math.min(...recs.map((r) => r.at)) : b.at, t1 = n ? Math.max(...recs.map((r) => r.at)) : b.at;
      return `<div class="hist" data-id="${b.id}"><div class="h1">${fmtDT(t0)} → ${fmtDT(t1).slice(-5)} · ${n} serial</div>
        <div class="h2">${esc(locs.join(', ') || '—')}${wait ? ` · <b style="color:var(--warn)">chờ gửi ${wait}</b>` : apiUrl() && n ? ' · đã lên Sheet' : ''}</div>
        <div class="btn-row"><button class="btn sm" data-a="xls" type="button">${icon('xls')}Excel</button>${canShareFiles() ? `<button class="btn sm" data-a="share" type="button">${icon('share')}Gửi</button>` : ''}<button class="btn sm ghost" data-a="del" type="button" style="color:var(--bad)">${icon('trash')}Xoá khỏi máy</button></div></div>`;
    }).join('');
  };
  wrap.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-a]'); if (!btn) return;
    const b = S.batches.find((x) => x.id === btn.closest('.hist').dataset.id); if (!b) return;
    if (btn.dataset.a === 'xls') exportBatch(b, 'download');
    if (btn.dataset.a === 'share') exportBatch(b, 'share');
    if (btn.dataset.a === 'del') {
      const wait = apiUrl() ? b.records.filter((r) => r.st !== 'ok').length : 0;
      const ok = await confirmBox('Xoá đợt khỏi máy?', 'Chỉ xoá trên điện thoại này, dữ liệu trên Google Sheet giữ nguyên.' + (wait ? `<br><br><b style="color:var(--bad)">${wait} serial chưa lên Sheet sẽ bị mất.</b>` : ''), 'Xoá', true);
      if (!ok) return;
      S.batches = S.batches.filter((x) => x !== b); saveBatches(); draw(); renderStatus();
    }
  });
  draw();
  openModal({ title: 'Lịch sử đợt quét', body: wrap });
}
$('#btnHistory').onclick = openHistory;

/* ------------------------------------------------------------------
   Cài đặt
------------------------------------------------------------------ */
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { installEvt = e; });
function openSettings() {
  const s = S.settings;
  const wrap = document.createElement('div');
  const sw = (k, label, sub) => `<div class="row"><div class="grow">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</div><label class="switch"><input type="checkbox" data-k="${k}" ${s[k] ? 'checked' : ''}><span></span></label></div>`;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  wrap.innerHTML = `
  <div class="sec"><h4>Google Sheet</h4>
    <input class="inp" id="setApi" type="url" inputmode="url" placeholder="${SCRIPT_URL ? 'Đang dùng URL cài sẵn trong app' : 'Dán URL Apps Script (…/exec)'}" value="${esc(s.api)}" autocomplete="off" spellcheck="false">
    <div class="btn-row">
      <button class="btn sm primary" data-a="test" type="button">${icon('refresh')}Kiểm tra kết nối</button>
      <button class="btn sm" data-a="cfg" type="button">${icon('refresh')}Tải lại danh mục</button>
      <button class="btn sm" data-a="link" type="button">${icon('link')}Link cài đặt cho team</button>
    </div>
    <div class="status-box" id="setStatus">${apiUrl() ? (S.config.sheetName ? `Đang nối: <b>${esc(S.config.sheetName)}</b>` : 'Đã có URL – bấm “Kiểm tra kết nối”.') : 'Chưa nối Google Sheet – serial chỉ lưu trên máy, vẫn xuất Excel được.'}${S.config.sheetUrl ? ` · <a href="${esc(S.config.sheetUrl)}" target="_blank" rel="noopener">Mở Google Sheet</a>` : ''}</div>
  </div>
  <div class="sec"><h4>Quét</h4>
    ${sw('continuous', 'Quét liên tục', 'Tắt: mỗi lần quét xong tạm dừng, bấm “Quét tiếp”')}
    ${sw('sound', 'Âm thanh “bíp”')}
    ${sw('vibrate', 'Rung khi quét', 'Không có trên iPhone')}
    ${sw('retail', 'Nhận cả mã vạch sản phẩm (EAN/UPC)', 'Mặc định bỏ qua để không quét nhầm mã sản phẩm trên thùng')}
    <div class="row"><div class="grow">Chỉ nhận mã bắt đầu bằng<span class="sub">VD: SN – để trống nếu không lọc</span></div><input type="text" data-k="prefix" value="${esc(s.prefix)}" autocapitalize="characters" spellcheck="false"></div>
    <div class="row"><div class="grow">Số ký tự tối thiểu</div><input type="number" data-k="minLen" min="1" max="40" value="${esc(s.minLen)}"></div>
    <div class="row"><div class="grow">Bộ giải mã<span class="sub">Đổi nếu máy quét chậm/khó nhận</span></div><select data-k="engine"><option value="auto">Tự động</option><option value="zxing">Chỉ ZXing</option><option value="native">Ưu tiên hệ thống</option></select></div>
  </div>
  <div class="sec"><h4>Ứng dụng</h4>
    <div class="row"><div class="grow">Cài vào màn hình chính<span class="sub">${standalone ? 'Đang chạy như ứng dụng' : ios ? 'Safari → nút Chia sẻ → “Thêm vào MH chính”' : 'Mở nhanh như app, chạy được khi mạng yếu'}</span></div>${!standalone && !ios ? `<button class="btn sm" data-a="install" type="button">Cài app</button>` : ''}</div>
    <div class="row"><div class="grow">Mã thiết bị<span class="sub">Ghi vào cột “Thiết bị” trên Sheet</span></div><b>${esc(S.device)}</b></div>
    <div class="row"><div class="grow">Xoá toàn bộ dữ liệu trên máy<span class="sub">Không ảnh hưởng Google Sheet</span></div><button class="btn sm danger" data-a="wipe" type="button">Xoá</button></div>
    <p class="muted">Phiên bản ${APP_VERSION}</p>
  </div>`;
  $('select[data-k=engine]', wrap).value = s.engine;
  const status = (html, cls = '') => { const b = $('#setStatus', wrap); b.className = 'status-box ' + cls; b.innerHTML = html; };
  const saveApi = () => {
    const v = $('#setApi', wrap).value.trim();
    if (v === s.api) return false;
    s.api = v; saveSettings(); S.config = { models: [], locations: [], users: [], sheetUrl: '', sheetName: '', at: 0 }; store(KEY.config, S.config);
    lastErr = ''; backoff = 0; renderStatus(); renderList();
    return true;
  };
  $('#setApi', wrap).addEventListener('change', () => { if (saveApi() && apiUrl()) { status('Đã lưu URL – đang kiểm tra…'); doTest(); } });
  const doTest = async () => {
    saveApi();
    if (!apiUrl()) { status('Chưa có URL.', 'bad'); return; }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(apiUrl())) status('Lưu ý: URL đúng thường có dạng https://script.google.com/macros/s/…/exec – đang thử…');
    else status('<i class="spin" style="display:inline-block;vertical-align:-3px"></i> Đang kiểm tra…');
    try {
      const r = await api({ action: 'ping' }, 25000);
      S.config.sheetName = r.sheetName || ''; S.config.sheetUrl = r.sheetUrl || ''; store(KEY.config, S.config);
      status(`✓ Kết nối OK: <b>${esc(r.sheetName || 'Google Sheet')}</b> · ${r.rows} dòng serial${r.sheetUrl ? ` · <a href="${esc(r.sheetUrl)}" target="_blank" rel="noopener">Mở Google Sheet</a>` : ''}`, 'ok');
      loadConfig(true); lastErr = ''; backoff = 0; sync();
    } catch (e) { status('✗ ' + esc(e.message), 'bad'); }
  };
  wrap.addEventListener('change', (e) => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (e.target.type === 'checkbox') s[k] = e.target.checked;
    else if (k === 'minLen') s[k] = clamp(parseInt(e.target.value, 10) || 1, 1, 40);
    else s[k] = e.target.value.trim();
    saveSettings();
    if (k === 'retail' || k === 'engine') { cam.nativeFormatsKey = ''; cam.workerDead = false; if (cam.running) initDecoders().then(() => { cam.gen++; loopNative(cam.gen); loopWorker(); }); }
  });
  wrap.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'test') doTest();
    if (a === 'cfg') { saveApi(); if (!apiUrl()) { status('Chưa có URL.', 'bad'); return; } status('Đang tải danh mục…'); const ok = await loadConfig(false); status(ok ? `✓ ${S.config.models.length} model · ${S.config.locations.length} kho/NPP/đại lý · ${S.config.users.length} người quét` : '✗ Không tải được danh mục', ok ? 'ok' : 'bad'); }
    if (a === 'link') {
      saveApi();
      if (!apiUrl()) { status('Dán URL Apps Script trước.', 'bad'); return; }
      const link = location.origin + location.pathname + '#api=' + encodeURIComponent(apiUrl());
      try { if (navigator.share) { await navigator.share({ title: 'Cài app Quét Serial', text: 'Mở link này để dùng app Quét Serial (tự nối Google Sheet):', url: link }); return; } } catch (err) { if (err.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(link); toast('Đã sao chép link cài đặt – gửi qua Zalo cho team', 'ok'); } catch (err) { status('Link cài đặt: <br><span style="font-size:12px;word-break:break-all">' + esc(link) + '</span>'); }
    }
    if (a === 'install') {
      let shown = false;
      if (installEvt) { try { await installEvt.prompt(); shown = true; } catch (err) { shown = false; } installEvt = null; }
      if (!shown) toast('Chrome → menu ⋮ → “Thêm vào màn hình chính” / “Cài đặt ứng dụng”', '', 4500);
    }
    if (a === 'wipe') {
      const wait = allRecs().filter((r) => r.st !== 'ok').length;
      const ok = await confirmBox('Xoá toàn bộ dữ liệu trên máy?', 'Xoá danh sách, lịch sử và cài đặt trên điện thoại này. Google Sheet giữ nguyên.' + (wait && apiUrl() ? `<br><br><b style="color:var(--bad)">${wait} serial chưa lên Sheet sẽ bị mất.</b>` : ''), 'Xoá hết', true);
      if (!ok) return;
      Object.values(KEY).forEach((k) => { try { localStorage.removeItem(k); } catch (err) { /* */ } });
      location.reload();
    }
  });
  openModal({ title: 'Cài đặt', body: wrap, onClose: () => { saveApi(); renderStatus(); } });
}
$('#btnSettings').onclick = openSettings;

/* ------------------------------------------------------------------
   Khởi động
------------------------------------------------------------------ */
renderSession(); renderList(); renderStatus();
if (apiUrl()) { sync(); if (Date.now() - (S.config.at || 0) > 6 * 3600 * 1000) loadConfig(true); }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// Cho kiểm thử tự động
window.__qs = { S, cam, addSerial, sync, buildXlsx, batchFile, exportBatch, productList };
})();

</script>
</body>
</html>
